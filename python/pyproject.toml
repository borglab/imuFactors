[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imuFactors"
version = "1.0.0"
description = "Visualization utilities for IMU factor evaluation"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Alec Kain", email = "akain@gatech.edu"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "plotly>=5.0",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
delama_gal3 = [
    "torch>=2.0",
]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/akain0/imuFactors"
Repository = "https://github.com/akain0/imuFactors"

[tool.setuptools.packages.find]
where = ["."]
include = ["imuFactors*"]